<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — страница не найдена</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #ffffff; color: #0f172a; text-align: center; padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .code { font-size: 120px; font-weight: 800; letter-spacing: -0.04em; color: #2563eb; line-height: 1; }
    h1 { font-size: 26px; margin: 16px 0 10px; }
    p { font-size: 17px; color: #64748b; max-width: 420px; margin: 0 auto 28px; }
    a {
      display: inline-block; font-weight: 600; font-size: 15px;
      color: #fff; background: #2563eb; text-decoration: none;
      padding: 12px 24px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет, но это наша кастомная 404 — её тоже раздаёт GitHub Pages.</p>
    <a href="/github-pages-demo/">На главную</a>
  </div>
</body>
</html>
